[package]
name = "iconcrete"
version = "1.0.0"
description = "iConcrete System — ready-mix concrete plant management"
authors = ["IConcrete System"]
edition = "2021"
rust-version = "1.77.2"

# The desktop shell is a thin wrapper: the whole product lives in the same React
# bundle the web build ships, and this crate only adds the offline SQLite store.
[lib]
name = "iconcrete_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# DO NOT REMOVE: used for production builds when no dev server is specified.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
