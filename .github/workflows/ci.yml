name: CI

# Every step must pass; there is no `continue-on-error` anywhere, so the job
# fails on the first real error. Free for public repositories on GitHub-hosted
# runners and needs no secrets: type checking, linting and unit tests run
# against the committed sources only.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails if any credential-shaped string is committed.
      - name: Secret scan
        run: bun run check:secrets

      # Fails if a design token drops below its WCAG AA target.
      - name: Contrast check
        run: bun run check:contrast

      - name: Typecheck (client)
        run: bun run typecheck

      # Convex functions are excluded from tsconfig.app.json, so they get their
      # own pass against src/convex/tsconfig.json.
      - name: Typecheck (convex)
        run: bun run typecheck:convex

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
